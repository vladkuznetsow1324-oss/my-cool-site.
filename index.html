<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Among Us: Space Platformer</title>
    
    <!-- [РЕСУРСЫ] -->
    <link rel="icon" href="Photo1.jpg" type="image/x-icon">
    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    
    <audio id="sndCoin"><source src="coin.mp3" type="audio/mpeg"></audio>
    <audio id="sndJump"><source src="jump.mp3" type="audio/mpeg"></audio>
    <audio id="sndTrampoline"><source src="trampoline.mp3" type="audio/mpeg"></audio>
    <audio id="sndTrap"><source src="trap_activate.mp3" type="audio/mpeg"></audio>
    <audio id="sndWalk" loop><source src="walk.mp3" type="audio/mpeg"></audio>
    <audio id="sndBuy"><source src="buy.mp3" type="audio/mpeg"></audio>
    <audio id="sndHit"><source src="hit.mp3" type="audio/mpeg"></audio>
    <audio id="sndDeath"><source src="death.mp3" type="audio/mpeg"></audio>

    <!-- [СТИЛИ] -->
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        
        /* Изменение 1: Минималистичный и чистый белый цвет для текста и кнопок в меню */
        #menu {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.85); z-index: 100; color: #ffffff;
        }
        #menu h1 { font-size: 50px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(255,255,255,0.5); color: #ffffff; }
        #menu p { color: #cccccc; }
        #menu button {
            padding: 15px 40px; font-size: 24px; cursor: pointer;
            background: transparent; border: 2px solid #ffffff; color: #ffffff;
            transition: 0.3s; font-family: inherit;
        }
        #menu button:hover { background: #ffffff; color: #000; box-shadow: 0 0 25px #ffffff; }
        
        /* Изменение 1: Белый текст для игровой панели очков */
        .ui { 
            position: absolute; top: 15px; left: 15px; 
            color: #ffffff; font-size: 20px; pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>AMONG US: SPACE PLATFORMER</h1>
        <p>Автор игры: VLDS_HLDS</p>
        <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    </div>

    <div class="ui" id="scoreBoard" style="display: none;">
        HP: 3 | Монеты: 0 | Рекорд: 0<br>Дистанция: 0
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CONFIG = {
        playerSpeed: 7, jumpPower: -16, gravity: 0.8, hpMax: 3, shopPrice: 10
    };

    let state = {
        distance: 0, coins: 0, hp: CONFIG.hpMax,
        highScore: localStorage.getItem('highScore') || 0,
        invulnerable: 0, cameraX: 0, gameActive: false,
        coinAnimTimer: 0
        // Изменение 2: Полностью убрали переменную bgOffset, фон статичен
    };

    const playerImg = new Image(); playerImg.src = 'Photo1.jpg'; 
    const coinImg = new Image(); coinImg.src = 'coin.png';
    const meteorImg = new Image(); meteorImg.src = 'meteor.png';

    const player = { 
        x: 50, y: 100, width: 55, height: 55, dx: 0, dy: 0, grounded: false,
        angle: 0, flipAngle: 0, isFlipping: false 
    };
    
    let platforms = []; let coins = []; let meteors = []; let stars = []; let particles = [];
    const keys = {};

    for(let i=0; i<120; i++) {
        stars.push({
            x: Math.random() * 2000, y: Math.random() * 1000, s: Math.random() * 2.5,
            alpha: Math.random(), twinkleSpeed: 0.01 + Math.random() * 0.03
        });
    }

    function playSnd(id) {
        const s = document.getElementById(id);
        if (s) { s.currentTime = 0; s.volume = 0.9; s.play().catch(() => {}); }
    }

    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('scoreBoard').style.display = 'block';
        const music = document.getElementById('bgMusic');
        if (music) { music.volume = 0.4; music.play().catch(() => {}); }
        state.gameActive = true;
        resetGame();
    }

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyB' && state.coins >= CONFIG.shopPrice) {
            state.coins -= CONFIG.shopPrice; state.hp++;
            playSnd('sndBuy');
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // === ГЕНЕРАЦИЯ МИРА ===
    function generateWorld() {
        if (platforms.length === 0) {
            platforms.push({x: 0, y: canvas.height / 2 + 100, w: 400, h: 40, type: 'normal', isTouched: false, timer: 60, scaleY: 1, targetScaleY: 1});
            return;
        }

        const lastP = platforms[platforms.length - 1];
        if (player.x > lastP.x - 1200) {
            
            // Изменение 4: Стабильная и на 100% проходимая генерация расстояний
            // Ограничиваем минимальную пропасть 80px, а максимальную 200px (даже с ростом дистанции)
            const baseGap = 80 + Math.random() * 80; 
            const dynamicGap = Math.min(40, state.distance / 400); // Небольшой прирост усложнения
            const finalGap = baseGap + dynamicGap; // Дистанция между плитами никогда не превысит честные 200px
            const newX = lastP.x + lastP.w + finalGap;
            
            // Стабилизируем высоту: перепады высот теперь плавные (не более 90px вверх или вниз)
            const targetY = lastP.y + (Math.random() * 180 - 90);
            const newY = Math.max(180, Math.min(canvas.height - 180, targetY));
            
            let rand = Math.random();
            let type = rand > 0.90 ? 'trap' : (rand > 0.80 ? 'jump' : (rand > 0.72 ? 'gold' : 'normal'));
            
            // Задаем случайную ширину плиты
            const pWidth = Math.random() * 150 + 90;
            
            platforms.push({
                x: newX, y: newY, w: pWidth, h: 25, type, 
                isTouched: false, timer: 60, scaleY: 1, targetScaleY: 1
            });
            
            // Изменение 3: Динамический расчет монет строго по центру желтой плиты
            if (type === 'gold') {
                // Вычисляем количество монет на основе ширины: маленькая плита = 2, средняя = 3, большая = 4
                let coinCount = 3;
                if (pWidth < 130) coinCount = 2;
                if (pWidth > 200) coinCount = 4;
                
                // Равномерно распределяем монетки по центру плиты
                const totalSpacing = (coinCount - 1) * 35; 
                const startX = newX + (pWidth - totalSpacing) / 2; 
                
                for(let c = 0; c < coinCount; c++) {
                    coins.push({x: startX + (c * 35), y: newY - 45, collected: false});
                }
            } else if (Math.random() > 0.4 && type === 'normal') {
                coins.push({x: newX + pWidth / 2, y: newY - 45, collected: false}); // Обычная монетка тоже по центру
            }
            
            if (Math.random() > 0.6) {
                let meteorSpeed = 5 + (state.distance / 3000);
                meteors.push({
                    x: player.x + canvas.width + 400, y: Math.random()*canvas.height, 
                    size: 24, speed: meteorSpeed, angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() * 0.05 + 0.02) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }
        if (platforms.length > 30) platforms.shift();
    }
    // === ПОДБЛОК: ЛОГИКА (ОБНОВЛЕНИЕ КАДРА) ===
    function update() {
        if (!state.gameActive) { draw(); requestAnimationFrame(update); return; }

        let moving = false;

        // Физика наклонов при беге
        if (keys['ArrowLeft'] || keys['KeyA']) {
            player.dx = -CONFIG.playerSpeed;
            player.angle = -0.15; 
            moving = true;
        } else if (keys['ArrowRight'] || keys['KeyD']) {
            player.dx = CONFIG.playerSpeed;
            player.angle = 0.15; 
            moving = true;
        } else {
            player.dx *= 0.8;
            player.angle *= 0.8; 
        }
        
        // Воспроизведение звука хождения по земле
        const walkSnd = document.getElementById('sndWalk');
        if (walkSnd) {
            walkSnd.volume = 0.9;
            if (moving && player.grounded) {
                if (walkSnd.paused) walkSnd.play().catch(() => {});
            } else {
                if (!walkSnd.paused) walkSnd.pause();
            }
        }

        // Кнопки прыжка
        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) { 
            player.dy = CONFIG.jumpPower; 
            player.grounded = false; 
            playSnd('sndJump');
        }

        // Вращение сальто
        if (player.isFlipping) {
            player.flipAngle += 0.2; 
            if (player.flipAngle >= Math.PI * 2) {
                player.flipAngle = 0;
                player.isFlipping = false; 
            }
        }

        player.dy += CONFIG.gravity;
        player.x += player.dx;
        player.y += player.dy;
        player.grounded = false;

        state.coinAnimTimer += 0.05;

        // Мерцание звезд
        stars.forEach(s => {
            s.alpha += s.twinkleSpeed;
            if (s.alpha > 1 || s.alpha < 0.2) s.twinkleSpeed = -s.twinkleSpeed;
        });

        // Пружинящие платформы
        platforms.forEach(p => {
            p.scaleY += (p.targetScaleY - p.scaleY) * 0.15;
            if (Math.abs(p.scaleY - p.targetScaleY) < 0.01) p.targetScaleY = 1;
        });

        // Взаимодействие с платформами
        platforms.forEach((p, i) => {
            if (player.x < p.x + p.w && player.x + player.width > p.x && player.y + player.height > p.y && player.y + player.height < p.y + p.h + 20 && player.dy >= 0) {
                player.y = p.y - player.height;
                
                if (p.type === 'jump') {
                    player.dy = CONFIG.jumpPower * 1.5;
                    p.scaleY = 0.4;
                    p.targetScaleY = 1.3;
                    
                    player.isFlipping = true;
                    player.flipAngle = 0;
                    playSnd('sndTrampoline');
                } else {
                    player.dy = 0;
                    player.isFlipping = false;
                    player.flipAngle = 0;
                }
                
                player.grounded = true;
                
                if (p.type === 'trap' && !p.isTouched) {
                    p.isTouched = true;
                    playSnd('sndTrap');
                }
            }
            if (p.isTouched) { 
                p.timer--; 
                if (p.timer <= 0) platforms.splice(i, 1); 
            }
        });

        // Сбор монет
        coins.forEach(c => {
            if (!c.collected && player.x < c.x + 25 && player.x + player.width > c.x - 25 && player.y < c.y + 25 && player.y + player.height > c.y - 25) {
                c.collected = true; 
                state.coins++;
                playSnd('sndCoin'); 
            }
        });

        // Частицы хвоста метеоритов
        meteors.forEach(m => {
            if (Math.random() > 0.3) {
                particles.push({
                    x: m.x + (Math.random() * 10 - 5), y: m.y + (Math.random() * 10 - 5),
                    vx: m.speed * 0.5 + Math.random() * 2, vy: Math.random() * 2 - 1,
                    size: Math.random() * 6 + 2, color: Math.random() > 0.5 ? '#ff4500' : '#ff8c00', alpha: 1
                });
            }
            m.angle += m.rotSpeed;
        });

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
            if (p.alpha <= 0) particles.splice(i, 1);
        });

        // Получение урона
        if (state.invulnerable > 0) state.invulnerable--;
        meteors.forEach((m, i) => {
            m.x -= m.speed;
            let dist = Math.sqrt(Math.pow((player.x+25)-m.x, 2) + Math.pow((player.y+25)-m.y, 2));
            if (dist < m.size + 15 && state.invulnerable <= 0) {
                state.hp--; 
                state.invulnerable = 60; 
                meteors.splice(i, 1);
                
                if (state.hp <= 0) {
                    playSnd('sndDeath'); 
                    resetGame();
                } else {
                    playSnd('sndHit'); 
                }
            }
        });

        // Падение
        if (player.y > canvas.height + 400) {
            playSnd('sndDeath');
            resetGame();
        }
        
        state.distance = Math.max(state.distance, Math.floor(player.x));
        if (state.distance > state.highScore) {
            state.highScore = state.distance;
            localStorage.setItem('highScore', state.highScore);
        }
        state.cameraX = player.x - canvas.width / 4;
        
        // Обновление UI
        document.getElementById('scoreBoard').innerHTML = 
            `HP: ${state.hp} | Монеты: ${state.coins} | Рекорд: ${state.highScore}<br>Дистанция: ${state.distance}<br>` +
            `<span style="color:#fff">Жми 'B' - купить HP (10 монет)</span>`; // Белая надпись покупки

        generateWorld();
        draw();
        requestAnimationFrame(update);
    }
    // === ПОДБЛОК: ОТРИСОВКА (ГРАФИКА) ===
    function draw() {
        // Изменение 2: Статичный космический градиент (без привязки к state.bgOffset)
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#050515');
        gradient.addColorStop(0.5, '#150828');
        gradient.addColorStop(1, '#050515');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Звезды по-прежнему мягко мерцают
        stars.forEach(s => {
            let sx = (s.x - state.cameraX * 0.2) % canvas.width;
            if (sx < 0) sx += canvas.width;
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.fillRect(sx, s.y, s.s, s.s);
        });

        ctx.save();
        ctx.translate(-state.cameraX, 0);

        // Хвосты метеоритов
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        });

        // Платформы
        platforms.forEach(p => {
            ctx.save();
            ctx.translate(p.x + p.w / 2, p.y + p.h);
            ctx.scale(1, p.scaleY);
            ctx.translate(-(p.x + p.w / 2), -(p.y + p.h));

            ctx.shadowBlur = 18;
            if (p.type === 'trap') { 
                if (p.isTouched && p.timer % 10 < 5) {
                    ctx.fillStyle = '#ff4d4d'; ctx.shadowColor = '#ff1a1a';
                } else {
                    ctx.fillStyle = p.isTouched ? '#cc2929' : '#661414'; ctx.shadowColor = '#ff3333'; 
                }
            }
            else if (p.type === 'jump') { 
                ctx.fillStyle = '#103d10'; ctx.shadowColor = '#00ff00'; 
            }
            else if (p.type === 'gold') {
                ctx.fillStyle = '#4a3c00'; ctx.shadowColor = '#ffd700';
            }
            else { 
                ctx.fillStyle = '#1a1a24'; ctx.shadowColor = '#8a2be2'; 
            }
            
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.shadowBlur = 0;
            
            if (p.type === 'jump') ctx.strokeStyle = '#00ff00';
            else if (p.type === 'trap') ctx.strokeStyle = '#ff3333';
            else if (p.type === 'gold') ctx.strokeStyle = '#ffd700';
            else ctx.strokeStyle = '#da70d6';
            
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            ctx.restore();
        });

        // Метеориты
        meteors.forEach(m => { 
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.angle);
            if (meteorImg.complete && meteorImg.width > 0) {
                ctx.drawImage(meteorImg, -m.size, -m.size, m.size * 2, m.size * 2);
            } else {
                ctx.shadowBlur = 25; ctx.shadowColor = '#ff4500';
                ctx.fillStyle = '#A0522D';
                ctx.beginPath(); ctx.arc(0, 0, m.size, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });

        // Монеты (Красиво распределяются по центру желтых плит)
        coins.forEach(c => { 
            if(!c.collected) { 
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.scale(Math.abs(Math.sin(state.coinAnimTimer)), 1); 
                ctx.imageSmoothingEnabled = false; 
                if (coinImg.complete && coinImg.width > 0) {
                    ctx.drawImage(coinImg, -17, -17, 34, 34);
                } else {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI*2); ctx.fill(); 
                    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.restore();
            } 
        });

        // Амогус
        if (state.invulnerable % 10 < 5) {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (player.isFlipping) {
                ctx.rotate(player.flipAngle);
            } else {
                ctx.rotate(player.angle);
            }
            
            if (playerImg.complete && playerImg.width > 0) {
                ctx.drawImage(playerImg, -player.width / 2, -player.height / 2, player.width, player.height);
            } else { 
                ctx.fillStyle = "red"; ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height); 
            }
            ctx.restore();
        }
        ctx.restore();
    }

    // === ПОДБЛОК: ПЕРЕЗАПУСК ===
    function resetGame() {
        const walkSnd = document.getElementById('sndWalk');
        if (walkSnd && !walkSnd.paused) walkSnd.pause();

        state.hp = CONFIG.hpMax; state.distance = 0; state.coins = 0; state.invulnerable = 0;
        player.x = 50; player.y = 100; player.dx = 0; player.dy = 0; player.angle = 0; player.flipAngle = 0; player.isFlipping = false;
        platforms = []; coins = []; meteors = []; particles = [];
        generateWorld(); 
    }

    update();
    </script>
</body>
</html>
