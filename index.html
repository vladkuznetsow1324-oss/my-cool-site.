<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Among Us: Space Platformer</title>
    
    <!-- [РЕСУРСЫ] -->
    <link rel="icon" href="Photo1.jpg" type="image/x-icon">
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- [СТИЛИ] -->
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #menu {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); z-index: 100; color: #00ff00;
        }
        #menu h1 { font-size: 50px; margin-bottom: 20px; text-shadow: 0 0 20px #00ff00; }
        #menu button {
            padding: 15px 40px; font-size: 24px; cursor: pointer;
            background: transparent; border: 2px solid #00ff00; color: #00ff00;
            transition: 0.3s; font-family: inherit;
        }
        #menu button:hover { background: #00ff00; color: #000; box-shadow: 0 0 30px #00ff00; }
        .ui { 
            position: absolute; top: 15px; left: 15px; 
            color: #00ff00; font-size: 20px; pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>AMONG US: SPACE PLATFORMER</h1>
        <!-- Изменение 4: Новый ник автора -->
        <p>Автор игры: VLDS_HLDS</p>
        <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    </div>

    <div class="ui" id="scoreBoard" style="display: none;">
        HP: 3 | Монеты: 0 | Рекорд: 0<br>Дистанция: 0
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // === НАСТРОЙКИ И ПЕРЕМЕННЫЕ ===
    const CONFIG = {
        playerSpeed: 7, jumpPower: -16, gravity: 0.8, hpMax: 3, shopPrice: 10
    };

    let state = {
        distance: 0, coins: 0, hp: CONFIG.hpMax,
        highScore: localStorage.getItem('highScore') || 0,
        invulnerable: 0, cameraX: 0, gameActive: false,
        coinAnimTimer: 0, bgOffset: 0
    };

    const playerImg = new Image(); playerImg.src = 'Photo1.jpg'; 
    const coinImg = new Image(); coinImg.src = 'coin.png';
    const meteorImg = new Image(); meteorImg.src = 'meteor.png';

    const player = { x: 50, y: 100, width: 55, height: 55, dx: 0, dy: 0, grounded: false };
    let platforms = []; let coins = []; let meteors = []; let stars = [];
    let particles = []; // Массив для огненных хвостов метеоритов
    const keys = {};

    for(let i=0; i<120; i++) {
        stars.push({
            x: Math.random() * 2000, y: Math.random() * 1000, s: Math.random() * 2.5,
            alpha: Math.random(), twinkleSpeed: 0.01 + Math.random() * 0.03
        });
    }

    // === СИСТЕМНЫЕ ФУНКЦИИ ===
    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('scoreBoard').style.display = 'block';
        const music = document.getElementById('bgMusic');
        if (music) music.play().catch(e => console.log("Музыка ждет клика:", e));
        state.gameActive = true;
        resetGame();
    }

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyB' && state.coins >= CONFIG.shopPrice) {
            state.coins -= CONFIG.shopPrice; state.hp++;
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // === ГЕНЕРАЦИЯ МИРА ===
    function generateWorld() {
        if (platforms.length === 0) {
            // Изменение 6: Добавили параметры scaleY для эффекта пружины батута
            platforms.push({x: 0, y: canvas.height / 2 + 100, w: 400, h: 40, type: 'normal', isTouched: false, timer: 60, scaleY: 1, targetScaleY: 1});
            return;
        }

        const lastP = platforms[platforms.length - 1];
        if (player.x > lastP.x - 1200) {
            const maxGap = Math.min(220, 140 + (state.distance / 150));
            const newX = lastP.x + lastP.w + Math.random() * maxGap + 70;
            const newY = Math.max(150, Math.min(canvas.height - 150, lastP.y + (Math.random() * 260 - 130)));
            let type = Math.random() > 0.88 ? 'trap' : (Math.random() > 0.8 ? 'jump' : 'normal');
            
            platforms.push({
                x: newX, y: newY, w: Math.random()*150+90, h: 25, type, 
                isTouched: false, timer: 60,
                scaleY: 1, targetScaleY: 1 // Переменные для анимации сжатия/батута
            });
            
            if (Math.random() > 0.4 && type === 'normal') {
                coins.push({x: newX + 50, y: newY - 45, collected: false});
            }
            
            // Изменение 2: Добавлен угол вращения (angle) и скорость вращения (rotSpeed) метеорита
            if (Math.random() > 0.6) {
                let meteorSpeed = 5 + (state.distance / 3000);
                meteors.push({
                    x: player.x + canvas.width + 400, y: Math.random()*canvas.height, 
                    size: 24, speed: meteorSpeed, 
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() * 0.05 + 0.02) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }
        if (platforms.length > 30) platforms.shift();
    }
    // === ПОДБЛОК: ЛОГИКА (ОБНОВЛЕНИЕ КАДРА) ===
    function update() {
        if (!state.gameActive) { draw(); requestAnimationFrame(update); return; }

        // Изменение 5: Новая раскладка управления (Стрелочки + WASD + Пробел)
        if (keys['ArrowLeft'] || keys['KeyA']) {
            player.dx = -CONFIG.playerSpeed;
        } else if (keys['ArrowRight'] || keys['KeyD']) {
            player.dx = CONFIG.playerSpeed;
        } else {
            player.dx *= 0.8;
        }
        
        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) { 
            player.dy = CONFIG.jumpPower; 
            player.grounded = false; 
        }

        player.dy += CONFIG.gravity;
        player.x += player.dx;
        player.y += player.dy;
        player.grounded = false;

        state.coinAnimTimer += 0.05;
        state.bgOffset += 0.2;

        // Мерцание звезд
        stars.forEach(s => {
            s.alpha += s.twinkleSpeed;
            if (s.alpha > 1 || s.alpha < 0.2) s.twinkleSpeed = -s.twinkleSpeed;
        });

        // Плавное возвращение платформ к исходной форме после сжатия (эффект резины)
        platforms.forEach(p => {
            p.scaleY += (p.targetScaleY - p.scaleY) * 0.15;
            if (Math.abs(p.scaleY - p.targetScaleY) < 0.01) p.targetScaleY = 1;
        });

        // Обработка платформ
        platforms.forEach((p, i) => {
            if (player.x < p.x + p.w && player.x + player.width > p.x && player.y + player.height > p.y && player.y + player.height < p.y + p.h + 20 && player.dy >= 0) {
                player.y = p.y - player.height;
                
                // Изменение 6: Зеленые плиты красиво пружинят при прыжке
                if (p.type === 'jump') {
                    player.dy = CONFIG.jumpPower * 1.5;
                    p.scaleY = 0.4; // Резко сжимаем плиту по вертикали
                    p.targetScaleY = 1.3; // Заставляем её спружинить вверх
                } else {
                    player.dy = 0;
                }
                
                player.grounded = true;
                if (p.type === 'trap') p.isTouched = true;
            }
            if (p.isTouched) { 
                p.timer--; 
                if (p.timer <= 0) platforms.splice(i, 1); 
            }
        });

        // Сбор монет
        coins.forEach(c => {
            if (!c.collected && player.x < c.x + 25 && player.x + player.width > c.x - 25 && player.y < c.y + 25 && player.y + player.height > c.y - 25) {
                c.collected = true; state.coins++;
            }
        });

        // Изменение 2: Генерация красно-оранжевых частиц для хвоста метеоритов
        meteors.forEach(m => {
            if (Math.random() > 0.3) {
                particles.push({
                    x: m.x + (Math.random() * 10 - 5),
                    y: m.y + (Math.random() * 10 - 5),
                    vx: m.speed * 0.5 + Math.random() * 2, // Летят назад
                    vy: Math.random() * 2 - 1,
                    size: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? '#ff4500' : '#ff8c00',
                    alpha: 1
                });
            }
            // Поворот метеорита вокруг своей оси
            m.angle += m.rotSpeed;
        });

        // Обновление и фильтрация частиц хвоста
        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.04; // Частицы плавно исчезают
            if (p.alpha <= 0) particles.splice(i, 1);
        });

        // Столкновение с метеоритами
        if (state.invulnerable > 0) state.invulnerable--;
        meteors.forEach((m, i) => {
            m.x -= m.speed;
            let dist = Math.sqrt(Math.pow((player.x+25)-m.x, 2) + Math.pow((player.y+25)-m.y, 2));
            if (dist < m.size + 15 && state.invulnerable <= 0) {
                state.hp--; state.invulnerable = 60; meteors.splice(i, 1);
                if (state.hp <= 0) resetGame();
            }
        });

        if (player.y > canvas.height + 400) resetGame();
        
        // Рекорды и камера
        state.distance = Math.max(state.distance, Math.floor(player.x));
        if (state.distance > state.highScore) {
            state.highScore = state.distance;
            localStorage.setItem('highScore', state.highScore);
        }
        state.cameraX = player.x - canvas.width / 4;
        
        document.getElementById('scoreBoard').innerHTML = 
            `HP: ${state.hp} | Монеты: ${state.coins} | Рекорд: ${state.highScore}<br>Дистанция: ${state.distance}<br>` +
            `<span style="color:#ff0">Жми 'B' - купить HP (10 монет)</span>`;

        generateWorld();
        draw();
        requestAnimationFrame(update);
    }

    // === ПОДБЛОК: ОТРИСОВКА (ГРАФИКА) ===
    function draw() {
        // Космический живой градиент
        let gradient = ctx.createLinearGradient(0, -state.bgOffset % canvas.height, 0, canvas.height + (-state.bgOffset % canvas.height));
        gradient.addColorStop(0, '#050515');
        gradient.addColorStop(0.5, '#150828');
        gradient.addColorStop(1, '#050515');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Звезды
        stars.forEach(s => {
            let sx = (s.x - state.cameraX * 0.2) % canvas.width;
            if (sx < 0) sx += canvas.width;
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.fillRect(sx, s.y, s.s, s.s);
        });

        ctx.save();
        ctx.translate(-state.cameraX, 0);

        // Изменение 2: Отрисовка огненных хвостов метеоритов
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // Изменение 3: Новый стильный дизайн плит под стиль нового фона
        platforms.forEach(p => {
            ctx.save();
            
            // Сдвиг контекста для отрисовки пружинящего эффекта снизу вверх
            ctx.translate(p.x + p.w / 2, p.y + p.h);
            ctx.scale(1, p.scaleY);
            ctx.translate(-(p.x + p.w / 2), -(p.y + p.h));

            ctx.shadowBlur = 18;
            if (p.type === 'trap') { 
                if (p.isTouched && p.timer % 10 < 5) {
                    ctx.fillStyle = '#ff4d4d'; ctx.shadowColor = '#ff1a1a';
                } else {
                    ctx.fillStyle = p.isTouched ? '#cc2929' : '#661414'; ctx.shadowColor = '#ff3333'; 
                }
            }
            // Зеленый батут с ярким неоновым свечением
            else if (p.type === 'jump') { 
                ctx.fillStyle = '#103d10'; ctx.shadowColor = '#00ff00'; 
            }
            // Изменение 3: Обычные плиты стали темно-графитовыми с мягким сине-фиолетовым неоновым светом
            else { 
                ctx.fillStyle = '#1a1a24'; ctx.shadowColor = '#8a2be2'; 
            }
            
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.shadowBlur = 0;
            
            // Красивая окантовка плит
            if (p.type === 'jump') ctx.strokeStyle = '#00ff00';
            else if (p.type === 'trap') ctx.strokeStyle = '#ff3333';
            else ctx.strokeStyle = '#da70d6';
            
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            ctx.restore();
        });

        // Изменение 2: Отрисовка метеоритов с вращением (Текстура или Свечение)
        meteors.forEach(m => { 
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.angle); // Вращаем контекст рисования
            
            if (meteorImg.complete && meteorImg.width > 0) {
                ctx.drawImage(meteorImg, -m.size, -m.size, m.size * 2, m.size * 2);
            } else {
                ctx.shadowBlur = 25; ctx.shadowColor = '#ff4500';
                ctx.fillStyle = '#A0522D';
                ctx.beginPath(); ctx.arc(0, 0, m.size, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });

        // Монеты (Изменение 1: Увеличен размер до радиуса 17 и добавлено сглаживание)
        coins.forEach(c => { 
            if(!c.collected) { 
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.scale(Math.abs(Math.sin(state.coinAnimTimer)), 1); 
                
                // Чтобы пиксельное разрешение не казалось размытым, отключаем сглаживание для текстуры монеты
                ctx.imageSmoothingEnabled = false; 
                
                if (coinImg.complete && coinImg.width > 0) {
                    ctx.drawImage(coinImg, -17, -17, 34, 34); // Изменение 1: увеличен размер с 28 до 34
                } else {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI*2); ctx.fill(); 
                    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.restore();
            } 
        });

        // Игрок
        if (state.invulnerable % 10 < 5) {
            if (playerImg.complete && playerImg.width > 0) {
                ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            } else { 
                ctx.fillStyle = "red"; ctx.fillRect(player.x, player.y, player.width, player.height); 
            }
        }
        ctx.restore();
    }

    // === ПОДБЛОК: ПЕРЕЗАПУСК ===
    function resetGame() {
        state.hp = CONFIG.hpMax; state.distance = 0; state.coins = 0; state.invulnerable = 0;
        player.x = 50; player.y = 100; player.dx = 0; player.dy = 0;
        platforms = []; coins = []; meteors = []; particles = [];
        generateWorld(); 
    }

    update();
    </script>
</body>
</html>
